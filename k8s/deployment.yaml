apiVersion: apps/v1
kind: Deployment
metadata:
  name: departmental-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: departmental-store
  template:
    metadata:
      labels:
        app: departmental-store
    spec:
      containers:
        - name: store-app
          image: sumit0177/departmental-store:latest
          env:
            - name: DISPLAY
              value: ":99"   # matches Dockerfile xvfb display
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Optional: mount volume to persist bills
          volumeMounts:
            - name: bills
              mountPath: /app/bills
      volumes:
        - name: bills
          emptyDir: {}